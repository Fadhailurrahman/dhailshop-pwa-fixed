  </head>

  <body>
    <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

    <header>
      <div class="main-header container">
        <a class="brand-name" href="#/" aria-label="Beranda dh@'ilShop.id">
          dh@'ilShop.id
        </a>

        <nav
          id="navigation-drawer"
          class="navigation-drawer"
          aria-label="Navigasi Utama"
        >
          <ul id="nav-list" class="nav-list">
            <li><a href="#/">Beranda</a></li>
            <li><a href="#/about">Tentang Kami</a></li>
            <li><a href="#/shop">Toko</a></li>
            <li><a href="#/offline" id="nav-offline">Produk Tersimpan</a></li>
            <li>
              <a href="#/login" id="nav-login">Login</a>
              <a href="#" id="nav-logout" style="display: none;">Logout</a>
            </li>
          </ul>
        </nav>

        <button
          id="drawer-button"
          class="drawer-button"
          aria-label="Menu Navigasi"
          aria-expanded="false"
        >
          ☰
        </button>
      </div>
    </header>

    <main id="main-content" class="main-content" tabindex="-1" role="main">
      <section class="auth-section">
        <div class="auth-card">
          <h2 class="auth-title">Masuk ke Akun Anda</h2>
          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="contoh@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" class="btn-primary">Masuk</button>

            <p class="auth-footer">
              Belum punya akun?
              <a href="#/register">Daftar di sini</a>
            </p>
          </form>
        </div>
      </section>
    </main>

    <div class="install-container" style="text-align:center; margin: 20px;">
      <button id="installButton" class="btn-primary" hidden>📲 Install Aplikasi</button>
    </div>

    <footer class="footer">

        <p>
